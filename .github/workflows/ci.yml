name: CI

on:
  push:
    branches: [main, test]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # 3.12 : la version de la production (backend/.python-version) ; 3.11 : minimum accepté (asyncio.timeout).
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
            backend/requirements.lock
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy)
        run: mypy
      - name: Tests (pytest)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Valeurs factices : le client Supabase exige ces variables à l'import, aucun appel réseau n'est fait.
      VITE_SUPABASE_URL: http://localhost
      VITE_SUPABASE_ANON_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Types (tsc)
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm test
      - name: Build
        run: npm run build

  # Veille des failles connues dans les dépendances figées. Informatif (n'empêche pas de fusionner) : une faille sans
  # correctif publié (ex. dépendance indirecte bornée par CrewAI) rendrait sinon la CI rouge en permanence. À lire à
  # chaque exécution, et à traiter en régénérant backend/requirements.lock quand un correctif existe.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Quatre avis `chromadb` 1.1.1 sont ignorés (les 5 lignes du rapport : PYSEC-2026-311 y figure deux fois), examinés le
      # 2026-10-12 : ils visent le SERVEUR Chroma (API REST /api/v2/tenants/…, autorisation RBAC, multi-locataire), que
      # l'application ne lance jamais ; chromadb n'est là que comme dépendance de CrewAI, dont l'application n'utilise ni la
      # mémoire ni les connaissances (vérifié par backend/tests/test_audit_premises.py). Aucune version corrigée n'existe et CrewAI
      # borne chromadb~=1.1.0. À revoir à chaque mise à jour de CrewAI ; toute NOUVELLE faille, elle, rend le job rouge.
      # Deux avis de plus, examinés le 2026-10-22, sans correctif accessible car CrewAI 1.15.23 borne ses dépendances : `mcp`
      # (CVE-2026-59951, fuite mémoire d'un serveur MCP HTTP ; `mcp~=1.28.1`, correctif en 1.30) et `uv` (PYSEC-2026-4321, racine
      # TLS révoquée ; `uv~=0.11.6`, correctif en 0.13.4). L'application ne sert pas de MCP et ne lance pas uv : prémisses vérifiées
      # par backend/tests/test_audit_premises.py. À revoir à chaque mise à jour de CrewAI. Les autres failles (aiohttp, certifi,
      # opentelemetry, pillow) ont été corrigées dans backend/requirements.lock.
      # (Un pip-audit en échec sautait aussi l'étape npm audit ci-dessous : elle ne tournait donc plus.)
      - name: Failles connues du verrou Python (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --no-deps --disable-pip -r backend/requirements.lock \
            --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln CVE-2026-59951 --ignore-vuln PYSEC-2026-4321
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Failles connues des dépendances npm de production
        working-directory: frontend
        run: npm audit --omit=dev
