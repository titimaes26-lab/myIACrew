# Mises à jour automatiques proposées chaque semaine. Python n'y figure pas : les dépendances backend sont figées par
# backend/requirements.lock, régénéré à la main (commande en tête du fichier) après lecture du journal de CrewAI ; la
# veille des failles Python est le job « audit » de la CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint n'accepte pas encore TypeScript 7 (peer « typescript < 6.1.0 ») : `npm ci` échoue. À retirer
      # quand une version de typescript-eslint déclare TypeScript 7 compatible.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
