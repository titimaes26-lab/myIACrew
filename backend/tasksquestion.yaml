qualification_task:
  description: >
    Analyse la demande utilisateur suivante :
    ---
    {user_request}
    ---
    
    Consignes strictes :
    1. Détermine la catégorie exacte parmi : ANALYSE_ONLY, BUGFIX, FEATURE, DESIGN_AND_DEV.
    2. Ne tente jamais d'exécuter des vérifications de fichiers sur le disque.
    3. Si la demande concerne un dysfonctionnement (ex: écran blanc, erreur de démarrage), choisis BUGFIX.
  expected_output: >
    Un rapport structuré contenant la catégorie choisie (ANALYSE_ONLY, BUGFIX, FEATURE ou DESIGN_AND_DEV) 
    et une justification courte.
  agent: qualification_agent

design_task:
  description: >
    Sur la base de la demande ({user_request}), commence par déterminer s'il s'agit d'un jeu
    ou d'une application/logiciel classique, puis définis les spécifications fonctionnelles
    adaptées : pour un jeu, les mécaniques, les règles, les entités nécessaires et le flux
    utilisateur ; pour une application, les fonctionnalités, les règles métier, les entités
    de données et les parcours utilisateur.

    Contexte de la conversation (tours précédents de cet utilisateur, à prendre en compte
    si la demande actuelle s'appuie dessus, ex: "ajoute aussi Y") :
    {conversation_context}

    Contexte repository :
    {repo_instructions}
    Si un repository GitHub cible est fourni, utilise `github_read_file` et `github_list_directory`
    (owner={repo_owner}, repo={repo_name}, branch={base_branch}) pour t'appuyer sur le code existant
    avant de rédiger les specs.

    Tu n'as accès à aucun outil d'écriture GitHub dans cette tâche (lecture seule). N'invente JAMAIS
    d'action GitHub réalisée (commit, branche créée, Pull Request ouverte) ni d'identifiants qui
    auraient l'air réels (numéro de PR, URL github.com/.../pull/N, SHA de commit) : rien de tout cela
    ne s'est produit. Si tu inclus un exemple de code illustratif, indique explicitement qu'il s'agit
    d'un exemple non exécuté.
  expected_output: >
    Un document de spécifications clair détaillant, selon le cas, les mécaniques de jeu ou les
    fonctionnalités applicatives, ainsi que les composants d'interface requis.
  agent: product_designer_agent

architecture_task:
  description: >
    Demande initiale de l'utilisateur :
    ---
    {user_request}
    ---
    Pour un workflow DESIGN_AND_DEV ou ANALYSE_ONLY, tu reçois aussi le document de spécifications
    (Game Design ou spécifications applicatives) produit par la tâche précédente, disponible dans
    ton contexte. Pour un workflow FEATURE en revanche, cette tâche est la PREMIÈRE du crew (aucune
    tâche de conception avant) : base-toi alors directement sur la demande ci-dessus, faute de quoi
    tu ne saurais pas ce qui doit être construit.
    Définis la structure des fichiers du projet React/Vite.
    Spécifie la hiérarchie des composants, les props et la gestion d'état.

    Contexte de la conversation (tours précédents de cet utilisateur) :
    {conversation_context}

    Contexte repository :
    {repo_instructions}
    Si un repository GitHub cible est fourni, utilise `github_read_file` et `github_list_directory`
    (owner={repo_owner}, repo={repo_name}, branch={base_branch}) pour analyser l'arborescence réelle du projet.

    Tu n'as accès à aucun outil d'écriture GitHub dans cette tâche (lecture seule). N'invente JAMAIS
    d'action GitHub réalisée (commit, branche créée, Pull Request ouverte) ni d'identifiants qui
    auraient l'air réels (numéro de PR, URL github.com/.../pull/N, SHA de commit) : rien de tout cela
    ne s'est produit. Si tu inclus un exemple de code illustratif (ex: un hook simulant un appel API),
    indique explicitement qu'il s'agit d'un exemple non exécuté et n'y fais figurer aucune donnée
    GitHub factice qui pourrait passer pour réelle.
  expected_output: >
    L'arborescence complète du projet et l'interface TypeScript des principaux composants.
  agent: architect_agent

diagnostic_task:
  description: >
    Demande initiale de l'utilisateur :
    ---
    {user_request}
    ---
    Base-toi sur cette demande (et, le cas échéant, sur les documents de spécifications/architecture
    produits par les tâches précédentes de ce workflow, disponibles dans ton contexte). Un workflow
    BUGFIX ne comprend que cette tâche, le Développeur et la QA, sans tâche de conception/architecture
    avant : sans la demande rappelée ci-dessus, tu n'aurais aucune information sur ce qui a été
    demandé, le contexte de conversation plus bas ne couvrant que les tours PRÉCÉDENTS, jamais la
    demande en cours.

    Détermine la cause réelle du bug (ou ce que la fonctionnalité demandée nécessite), puis rédige le
    CODE SOURCE COMPLET des fichiers à créer ou modifier. Ce code sera committé TEL QUEL par la tâche
    suivante (le Développeur), qui n'a lui-même AUCUN outil de lecture ni de raisonnement sur son
    contenu — c'est un pur exécutant GitHub. Si tu laisses un extrait incomplet, une section "..." ou
    une note "à compléter", elle sera committée ainsi sur GitHub sans que personne ne la complète.
    Chaque fichier de ta sortie doit donc être entier et directement utilisable.

    Si la demande ci-dessus décrit spécifiquement un écran blanc ou une erreur de démarrage, ta
    correction doit porter sur le point d'entrée (`index.html`) et le point de montage React
    (`src/main.tsx`) : lis-les avant de fournir ton correctif.
    Pour tout autre BUGFIX, NE PRÉSUME JAMAIS qu'il s'agit d'un écran blanc simplement parce que la
    catégorie du workflow est "BUGFIX" : diagnostique la cause réelle à partir de ce que la demande
    ci-dessus décrit précisément (ex: un calcul faux, une validation de formulaire qui échoue, un
    comportement incorrect signalé par l'utilisateur), en lisant le code concerné.
    Ce diagnostic doit rester raisonnable : au maximum 2-3 appels de lecture (`github_read_file` ou
    `read_a_files_content`) avant de conclure et de rédiger le code. Si après ce budget la cause
    exacte reste incertaine, corrige la cause la PLUS PROBABLE à partir de ce que tu as déjà lu
    plutôt que de continuer à investiguer : un correctif imparfait mais rédigé vaut toujours mieux
    qu'une analyse jamais conclue, qui laisserait la tâche suivante sans rien à committer.

    Contexte de la conversation (tours précédents de cet utilisateur) :
    {conversation_context}
    Ce contexte est un RÉSUMÉ potentiellement imprécis ou incomplet rédigé à un tour précédent, pas
    une preuve de l'état réel du code : ne présume jamais qu'un fichier existe, a tel contenu, ou
    qu'une action a réussi uniquement parce que ce résumé l'affirme. Pour savoir SUR QUELLE BRANCHE
    lire, fie-toi exclusivement à ce que dit "Contexte repository" ci-dessous (calculé de façon
    fiable par le système, pas résumé par un LLM), jamais à ce résumé de conversation.

    Contexte repository :
    {repo_instructions}
    Si un repository GitHub cible est fourni, utilise `github_read_file` et `github_list_directory`
    (owner={repo_owner}, repo={repo_name}) pour lire le code existant pertinent, sur la branche que
    "Contexte repository" ci-dessus indique (jamais une autre : lire {work_branch} alors qu'il
    n'existe pas encore produirait une erreur inutile ; lire {base_branch} alors que {work_branch}
    existe déjà ignorerait un correctif commité à un tour précédent sur cette même branche). Tu n'as
    accès à aucun outil d'écriture GitHub : ce n'est pas ton rôle de committer, seulement de produire
    le code — n'invente JAMAIS d'action GitHub réalisée (commit, branche créée, Pull Request ouverte)
    ni d'identifiants qui auraient l'air réels, rien de tout cela ne s'est produit à ce stade.
    Sans repository cible (travail sur disque local), utilise `read_a_files_content` pour toute
    lecture.

    Énonce d'abord la liste des fichiers que tu comptes créer ou modifier et une justification d'une
    ligne pour chacun, puis pour CHACUN un titre "### Fichier : <chemin>" suivi d'un bloc de code
    contenant l'intégralité de son contenu — pas un extrait, pas un résumé — pour que la tâche
    suivante puisse le committer sans la moindre ambiguïté sur quel contenu va dans quel fichier.
    ATTENTION pour un fichier déjà volumineux dont tu ne changes qu'une petite partie : la tâche
    suivante n'a AUCUN moyen de vérifier ou compléter ce que tu écris ici — ni de lire le fichier
    original, ni d'appliquer une modification partielle — elle committe tel quel, intégralement,
    exactement ce que tu lui fournis. Si tu risques de ne pas pouvoir réécrire ce fichier EN ENTIER
    sans le tronquer, N'INCLUS PAS de bloc de code pour lui : committer une version coupée (donc
    corrompue, sans que personne ne s'en aperçoive avant la QA) est PIRE que ne rien committer pour
    ce fichier précis. Liste-le à la place, dans ton plan, comme élément NON réalisé avec la raison
    ("fichier trop volumineux pour être rédigé en entier dans le budget disponible").
  expected_output: >
    Le plan (liste des fichiers prévus et leur justification, avec un signalement explicite pour
    tout fichier où le contenu complet n'a pas pu être fourni sans risque de troncature), puis pour
    chacun un titre "### Fichier : <chemin>" suivi du code source COMPLET et directement utilisable
    de ce fichier.
  agent: diagnostic_agent

development_task:
  description: >
    L'Analyste Diagnostic Technique (tâche précédente, disponible dans ton contexte) a déjà déterminé
    la cause du problème et rédigé le code source complet, fichier par fichier, de ce qu'il faut
    créer ou modifier. Ce N'EST PAS ton rôle de le revérifier, le redériver ou le questionner —
    utilise-le TEL QUEL, fichier par fichier. Ta seule responsabilité est de le committer fidèlement
    selon la procédure ci-dessous : tu n'as toi-même aucun outil de lecture, tu ne peux donc de toute
    façon pas le réanalyser.

    Contexte repository :
    {repo_instructions}
    Si un repository GitHub cible est fourni (owner={repo_owner}, repo={repo_name}), applique
    STRICTEMENT cette procédure au lieu d'écrire sur le disque local :
    1. Appelle `github_create_branch` avec new_branch={work_branch} et base_branch={base_branch} (un
       seul appel, idempotent : si la branche existe déjà, l'outil te le confirme sans erreur, tu
       peux l'utiliser directement).
    2. DÈS QUE PLUS DE 2-3 FICHIERS doivent être créés ou intégralement réécrits, utilise
       `github_write_files` : il committe TOUS ces fichiers EN UN SEUL appel d'outil, quel que soit
       leur nombre — c'est TA PRIORITÉ ABSOLUE, avant tout `check_syntax`. Un lot jamais committé (0
       fichier réellement présent sur GitHub) est bien pire qu'un lot committé avec une imperfection
       mineure que la QA détectera ensuite. Pour un fichier isolé (1-2 fichiers seulement),
       `github_write_file` reste suffisant. Tu n'as PAS accès à `github_edit_file` (aucune édition
       partielle) : l'Analyste t'a fourni le contenu COMPLET de chaque fichier, écris-le tel quel,
       intégralement, avec `github_write_file`/`github_write_files` — jamais un extrait.
       Depuis peu, `github_write_file` et `github_write_files` valident eux-mêmes le contenu
       Python/JSON/YAML (vérification exacte) AVANT tout commit, pour détecter une troncature du
       contenu que l'Analyste t'a fourni. JS/TS/JSX/TSX n'est PAS vérifié automatiquement (leur
       heuristique de vérification a des faux positifs connus sur le texte JSX) — pour ces
       extensions, ce contrôle reste uniquement celui que tu effectues toi-même à l'étape 3 si tu
       as du budget restant. `github_write_file` refuse le commit d'un fichier Python/JSON/YAML
       invalide et te renvoie l'erreur sans rien écrire sur GitHub. `github_write_files` committe
       uniquement les fichiers qui passent et liste les autres dans une section "REJETÉS" de sa
       réponse (ou refuse tout le lot si AUCUN ne passe). Dans les deux cas, NE RETENTE JAMAIS le
       même appel avec un contenu identique pour un fichier rejeté : tu n'as aucun moyen de le
       corriger (pas d'outil de lecture). Traite chaque fichier REJETÉ exactement comme un fichier
       que ton budget d'appels ne t'aurait pas permis de committer : liste-le EXPLICITEMENT dans
       ton rapport final comme non livré, avec la raison donnée par l'outil.
    3. S'il te reste du budget après le commit, vérifie avec `check_syntax` les fichiers qui te
       semblent les plus à risque. En cas de problème, recommitte le fichier concerné en entier
       avec `github_write_file` (jamais un extrait) — mais NE retarde jamais l'étape 2 pour ça :
       qa_task (la tâche suivante) revérifie de toute façon après coup.
    4. Une fois toutes les modifications commitées, appelle `github_open_pull_request`
       (branch={work_branch}, base_branch={base_branch}) avec un titre et une description résumant
       les changements (reprends le plan de l'Analyste).
    Ne modifie jamais directement la branche {base_branch}.
    Sans repository cible (travail sur disque local), utilise `file_write_tool` pour écrire chaque
    fichier fourni par l'Analyste, sans en modifier le contenu.

    Si tu approches de la limite d'appels d'outils disponibles avant d'avoir committé tous les
    fichiers fournis par l'Analyste, priorise un sous-ensemble cohérent et fonctionnel (jamais un
    fichier à moitié écrit ni une branche sans commit) plutôt que de tout laisser incomplet, et
    indique EXPLICITEMENT dans ton rapport final la liste des fichiers non committés.
  expected_output: >
    La confirmation, fichier par fichier, de ce qui a été committé (ou non, avec la raison), et si un
    repository cible était fourni, l'URL de la Pull Request créée.
  agent: developer_agent

qa_task:
  description: >
    Demande initiale de l'utilisateur (rappelée ici pour comparaison, voir plus bas) :
    ---
    {user_request}
    ---

    Revois le code produit par le Développeur (le plan et le contenu complet rédigés par
    l'Analyste, committés tels quels par le Développeur — voir leurs rapports respectifs). Ne
    fais JAMAIS confiance à ces rapports sur la seule foi de leurs affirmations : pour chaque
    fichier annoncé comme créé ou modifié, récupère son contenu RÉEL en UNE SEULE lecture — avec
    `github_read_file` sur la branche de travail ({work_branch}) si un repository cible est
    fourni (jamais depuis le disque local dans ce cas, puisque le Développeur n'y a rien écrit),
    ou avec `read_a_files_content` sinon — et réutilise ce même contenu pour les DEUX
    vérifications suivantes, SANS le relire une seconde fois :
    1. Présence et contenu réels : le fichier existe-t-il, et son contenu correspond-il à ce que
       l'Analyste a rédigé et que le Développeur prétend avoir committé ? Un fichier annoncé mais
       absent, ou dont le contenu diverge de ce qui est décrit (par exemple si le Développeur a
       committé un contenu différent de celui rédigé par l'Analyste), est un problème BLOQUANT à
       signaler explicitement, pas un détail mineur.
    2. Syntaxe (extensions .py/.json/.yaml/.ts/.tsx/.js/.jsx uniquement) : appelle `check_syntax`
       sur ce même contenu (vérification statique, sans exécution) — ne te contente jamais d'une
       relecture visuelle pour juger de la validité syntaxique. Vérifie aussi les importations
       manquantes et les incohérences de montage React. Dans ton rapport, distingue clairement ce
       que tu as vérifié avec `check_syntax` (et son résultat exact) de ce que tu n'as évalué
       qu'en lisant le code : n'affirme jamais une absence de bug que tu n'as pas réellement
       vérifiée avec l'outil.

    Sur un TRÈS GROS lot de fichiers (le Développeur peut désormais en committer des dizaines en
    un seul appel via `github_write_files`, voir development_task), lire et vérifier CHACUN de
    cette façon peut dépasser ton propre budget d'appels d'outils : dans ce cas, commence par
    `github_list_directory` (peu coûteux, un seul appel) pour au moins confirmer que les fichiers
    annoncés sont bien présents, puis approfondis (lecture + `check_syntax`) sur autant de
    fichiers que ton budget le permet en priorisant les plus à risque (logique complexe, fichiers
    de configuration structurants comme `package.json`/`tsconfig.json`) plutôt que de t'arrêter à
    mi-chemin sans jamais conclure — liste EXPLICITEMENT dans ton rapport les fichiers que tu
    n'as pas pu vérifier, faute de budget restant.

    Si un repository cible est fourni, tu n'as pas d'outil pour vérifier toi-même qu'une Pull
    Request a réellement été ouverte : dis-le clairement dans ton rapport plutôt que de confirmer
    une affirmation que tu ne peux pas contrôler. Si le Développeur a lui-même signalé, dans son
    rapport, des fichiers non committés, reflète-le explicitement dans ta conclusion : ne
    recommande jamais la mise en production d'un travail que le Développeur a lui-même qualifié
    d'incomplet.

    Au-delà de la syntaxe et de la véracité de ces rapports, compare aussi le résultat livré à la
    demande initiale rappelée en haut de cette tâche : un code syntaxiquement valide et fidèlement
    committé peut quand même ne PAS répondre à ce que l'utilisateur a réellement demandé (ex: un
    correctif qui traite un symptôme différent du bug décrit, une fonctionnalité qui ne couvre
    qu'une partie de ce qui était demandé). Si tu identifies un tel écart, signale-le explicitement
    dans ta conclusion, même si tout le reste (syntaxe, fichiers réellement présents) est correct.

    Contexte de la conversation (tours précédents de cet utilisateur) :
    {conversation_context}

    Contexte repository :
    {repo_instructions}
  expected_output: >
    Un rapport de validation QA listant, pour chaque fichier vérifié, le résultat exact de
    `check_syntax` ET la confirmation (ou l'infirmation) de ce que le Développeur prétend avoir
    fait, une évaluation de la correspondance entre le résultat livré et la demande initiale, puis
    une conclusion sur la mise en production ou une liste de correctifs mineurs.
  agent: qa_agent