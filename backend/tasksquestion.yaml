qualification_task:
  description: >
    Analyse la demande utilisateur suivante :
    ---
    {user_request}
    ---
    
    Consignes strictes :
    1. Détermine la catégorie exacte parmi : ANALYSE_ONLY, BUGFIX, FEATURE, DESIGN_AND_DEV.
    2. Ne tente jamais d'exécuter des vérifications de fichiers sur le disque.
    3. Si la demande concerne un dysfonctionnement (ex: écran blanc, erreur de démarrage), choisis BUGFIX.
  expected_output: >
    Un rapport structuré contenant la catégorie choisie (ANALYSE_ONLY, BUGFIX, FEATURE ou DESIGN_AND_DEV) 
    et une justification courte.
  agent: qualification_agent

design_task:
  description: >
    Sur la base de la demande ({user_request}), commence par déterminer s'il s'agit d'un jeu
    ou d'une application/logiciel classique, puis définis les spécifications fonctionnelles
    adaptées : pour un jeu, les mécaniques, les règles, les entités nécessaires et le flux
    utilisateur ; pour une application, les fonctionnalités, les règles métier, les entités
    de données et les parcours utilisateur.

    Contexte de la conversation (tours précédents de cet utilisateur, à prendre en compte
    si la demande actuelle s'appuie dessus, ex: "ajoute aussi Y") :
    {conversation_context}

    Contexte repository :
    {repo_instructions}
    Si un repository GitHub cible est fourni, utilise `github_read_file` et `github_list_directory`
    (owner={repo_owner}, repo={repo_name}, branch={base_branch}) pour t'appuyer sur le code existant
    avant de rédiger les specs.

    Tu n'as accès à aucun outil d'écriture GitHub dans cette tâche (lecture seule). N'invente JAMAIS
    d'action GitHub réalisée (commit, branche créée, Pull Request ouverte) ni d'identifiants qui
    auraient l'air réels (numéro de PR, URL github.com/.../pull/N, SHA de commit) : rien de tout cela
    ne s'est produit. Si tu inclus un exemple de code illustratif, indique explicitement qu'il s'agit
    d'un exemple non exécuté.
  expected_output: >
    Un document de spécifications clair détaillant, selon le cas, les mécaniques de jeu ou les
    fonctionnalités applicatives, ainsi que les composants d'interface requis.
  agent: product_designer_agent

architecture_task:
  description: >
    Demande initiale de l'utilisateur :
    ---
    {user_request}
    ---
    Pour un workflow DESIGN_AND_DEV ou ANALYSE_ONLY, tu reçois aussi le document de spécifications
    (Game Design ou spécifications applicatives) produit par la tâche précédente, disponible dans
    ton contexte. Pour un workflow FEATURE en revanche, cette tâche est la PREMIÈRE du crew (aucune
    tâche de conception avant) : base-toi alors directement sur la demande ci-dessus, faute de quoi
    tu ne saurais pas ce qui doit être construit.
    Définis la structure des fichiers du projet React/Vite.
    Spécifie la hiérarchie des composants, les props et la gestion d'état.

    Contexte de la conversation (tours précédents de cet utilisateur) :
    {conversation_context}

    Contexte repository :
    {repo_instructions}
    Si un repository GitHub cible est fourni, utilise `github_read_file` et `github_list_directory`
    (owner={repo_owner}, repo={repo_name}, branch={base_branch}) pour analyser l'arborescence réelle du projet.

    Tu n'as accès à aucun outil d'écriture GitHub dans cette tâche (lecture seule). N'invente JAMAIS
    d'action GitHub réalisée (commit, branche créée, Pull Request ouverte) ni d'identifiants qui
    auraient l'air réels (numéro de PR, URL github.com/.../pull/N, SHA de commit) : rien de tout cela
    ne s'est produit. Si tu inclus un exemple de code illustratif (ex: un hook simulant un appel API),
    indique explicitement qu'il s'agit d'un exemple non exécuté et n'y fais figurer aucune donnée
    GitHub factice qui pourrait passer pour réelle.
  expected_output: >
    L'arborescence complète du projet et l'interface TypeScript des principaux composants.
  agent: architect_agent

development_task:
  description: >
    Demande initiale de l'utilisateur :
    ---
    {user_request}
    ---
    Base-toi sur cette demande (et, le cas échéant, sur les documents de spécifications/architecture
    produits par les tâches précédentes de ce workflow, disponibles dans ton contexte). Un workflow
    BUGFIX ne comprend que cette tâche et la QA, sans tâche de conception/architecture avant : sans
    la demande rappelée ci-dessus, tu n'aurais aucune information sur ce qui a été demandé, le
    contexte de conversation plus bas ne couvrant que les tours PRÉCÉDENTS, jamais la demande en
    cours.

    Génère le code source complet ou apporte les corrections nécessaires sur les fichiers existants.
    Si la demande ci-dessus décrit spécifiquement un écran blanc ou une erreur de démarrage, ta
    correction doit porter sur le point d'entrée (`index.html`) et le point de montage React
    (`src/main.tsx`) : lis-les avant de fournir ton correctif (voir plus bas comment lire un fichier
    existant selon qu'un repository cible est fourni ou non — une seule et même procédure, pas
    d'appel d'outil distinct à faire ici).
    Pour tout autre BUGFIX, NE PRÉSUME JAMAIS qu'il s'agit d'un écran blanc simplement parce que la
    catégorie du workflow est "BUGFIX" : diagnostique la cause réelle à partir de ce que la demande
    ci-dessus décrit précisément (ex: un calcul faux, une validation de formulaire qui échoue, un
    comportement incorrect signalé par l'utilisateur), en lisant le code concerné.

    Avant d'écrire quoi que ce soit, énonce dans ta sortie finale (avant le code) la liste des
    fichiers que tu comptes créer ou modifier et une justification d'une ligne pour chacun : ce
    plan doit rester visible pour que la QA et l'utilisateur puissent suivre ton raisonnement,
    pas seulement constater le résultat final.

    Contexte de la conversation (tours précédents de cet utilisateur, notamment la
    branche de travail éventuellement déjà utilisée) :
    {conversation_context}
    Ce contexte est un RÉSUMÉ potentiellement imprécis ou incomplet rédigé à un tour précédent,
    pas une preuve de l'état réel du code. Si un repository cible est fourni et que ce résumé
    mentionne une branche de travail déjà utilisée, relis l'état RÉEL des fichiers concernés avec
    `github_read_file` (branch={work_branch}) avant de t'appuyer dessus : ne présume jamais qu'un
    fichier existe, a tel contenu, ou qu'une action a réussi uniquement parce que le résumé
    l'affirme.

    Contexte repository :
    {repo_instructions}
    Si un repository GitHub cible est fourni (owner={repo_owner}, repo={repo_name}), applique STRICTEMENT
    cette procédure au lieu d'écrire sur le disque local :
    1. Appelle `github_create_branch` avec new_branch={work_branch} et base_branch={base_branch}
       (un seul appel pour toute cette tâche, y compris pour toute lecture diagnostique d'un fichier
       existant à l'étape 2).
    2. Pour un nouveau fichier, lis d'abord le contexte utile avec `github_read_file`
       (branch={base_branch}) puis crée-le avec `github_write_file` (branch={work_branch}).
       Pour lire un fichier déjà existant (diagnostic d'un bug, ou avant une correction ciblée),
       utilise `github_read_file` sur {work_branch} — jamais {base_branch}, qui ne refléterait pas
       un correctif déjà commité à un tour précédent sur cette même branche de travail réutilisée.
       Pour une correction ciblée sur un fichier déjà existant et volumineux, préfère
       `github_edit_file` (extrait exact à remplacer) à `github_write_file` : c'est plus
       rapide et ça évite de faire disparaître du contenu en régénérant tout le fichier. Si
       `github_edit_file` t'indique explicitement un ÉCHEC RÉPÉTÉ sur ce même fichier,
       n'insiste pas avec une nouvelle tentative : bascule sur `github_write_file` avec son
       contenu complet déjà corrigé, plutôt que de risquer d'épuiser ton budget d'appels
       d'outils sur un seul fichier sans jamais committer de correctif. Toujours un
       commit_message clair.
    3. Avant de committer un fichier .py/.json/.yaml/.ts/.tsx/.js/.jsx, vérifie sa syntaxe
       avec `check_syntax` (vérification statique, sans exécution) et corrige tout problème
       signalé avant de continuer.
    4. Une fois toutes les modifications commitées, appelle `github_open_pull_request`
       (branch={work_branch}, base_branch={base_branch}) avec un titre et une description résumant les changements.
    Ne modifie jamais directement la branche {base_branch}.
    Sans repository cible (travail sur disque local), utilise `read_a_files_content` pour toute
    lecture, y compris diagnostique.

    Si tu approches de la limite d'appels d'outils disponibles avant d'avoir terminé tous les
    fichiers prévus dans ton plan, priorise la livraison d'un sous-ensemble cohérent et
    fonctionnel (jamais un fichier à moitié écrit ni une branche sans commit) plutôt que de tout
    laisser incomplet, et indique EXPLICITEMENT dans ton rapport final la liste des éléments du
    plan qui n'ont pas pu être réalisés.
  expected_output: >
    D'abord le plan (liste des fichiers prévus et leur justification), puis le code source complet
    des fichiers créés ou modifiés, la liste explicite de tout élément du plan resté incomplet le
    cas échéant, et si un repository cible était fourni, l'URL de la Pull Request créée.
  agent: developer_agent

qa_task:
  description: >
    Demande initiale de l'utilisateur (rappelée ici pour comparaison, voir plus bas) :
    ---
    {user_request}
    ---

    Revois le code produit par le Développeur.
    Pour chaque fichier .py/.json/.yaml/.ts/.tsx/.js/.jsx créé ou modifié, appelle l'outil
    `check_syntax` sur son contenu (vérification statique, sans exécution) avant de conclure :
    ne te contente pas d'une relecture visuelle pour juger de la validité syntaxique. Récupère ce
    contenu avec `github_read_file` sur la branche de travail ({work_branch}) si un repository
    cible est fourni (jamais depuis le disque local dans ce cas, puisque le Développeur n'y a rien
    écrit), ou avec `read_a_files_content` sinon.
    Vérifie aussi les importations manquantes et les incohérences de montage React.
    Dans ton rapport, distingue clairement ce que tu as vérifié avec `check_syntax` (et son
    résultat exact) de ce que tu n'as évalué qu'en lisant le code : n'affirme jamais une
    absence de bug que tu n'as pas réellement vérifiée avec l'outil.

    Ne fais JAMAIS confiance au rapport du Développeur sur la seule foi de ses affirmations.
    Pour chaque fichier qu'il prétend avoir créé ou modifié (voir son plan et sa liste de
    fichiers dans son rapport), confirme sa présence ET son contenu réels : si un repository
    cible est fourni, avec `github_read_file` sur la branche de travail ({work_branch}) — utilise
    `github_list_directory` seulement pour repérer les fichiers présents, jamais pour juger de
    leur contenu, qu'il ne renvoie pas ; sinon (travail sur disque local), avec
    `read_a_files_content`. Un fichier annoncé mais absent, ou dont le contenu diverge de ce qui
    est décrit, est un problème BLOQUANT à signaler explicitement, pas un détail mineur. Si un
    repository cible est fourni,
    tu n'as pas d'outil pour vérifier toi-même qu'une Pull Request a réellement été ouverte :
    dis-le clairement dans ton rapport plutôt que de confirmer une affirmation que tu ne peux pas
    contrôler. Si le Développeur a lui-même signalé, dans son rapport, des éléments de son plan
    restés incomplets, reflète-le explicitement dans ta conclusion : ne recommande jamais la mise
    en production d'un travail
    que le Développeur a lui-même qualifié d'incomplet.

    Au-delà de la syntaxe et de la véracité des affirmations du Développeur, compare aussi le
    résultat livré à la demande initiale rappelée en haut de cette tâche : un code syntaxiquement
    valide et fidèlement décrit par le Développeur peut quand même ne PAS répondre à ce que
    l'utilisateur a réellement demandé (ex: un correctif qui traite un symptôme différent du bug
    décrit, une fonctionnalité qui ne couvre qu'une partie de ce qui était demandé). Si tu identifies
    un tel écart, signale-le explicitement dans ta conclusion, même si tout le reste (syntaxe,
    fichiers réellement présents) est correct.

    Contexte de la conversation (tours précédents de cet utilisateur) :
    {conversation_context}

    Contexte repository :
    {repo_instructions}
  expected_output: >
    Un rapport de validation QA listant, pour chaque fichier vérifié, le résultat exact de
    `check_syntax` ET la confirmation (ou l'infirmation) de ce que le Développeur prétend avoir
    fait, une évaluation de la correspondance entre le résultat livré et la demande initiale, puis
    une conclusion sur la mise en production ou une liste de correctifs mineurs.
  agent: qa_agent