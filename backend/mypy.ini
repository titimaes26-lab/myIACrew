# Typage vérifié sur les modules récents et purs (sans dépendance lourde) ; les gros modules historiques
# (main.py, crewquestion.py, github_tools.py) y entreront par étapes, au fur et à mesure de leur découpage.
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
files = errors.py, validation.py, orphans.py, delivery.py, qa_report.py, agent_metrics.py
