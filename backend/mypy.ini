# Typage vérifié sur les modules récents et purs (sans dépendance lourde) ; les gros modules historiques
# (github_tools.py) y entreront par étapes, au fur et à mesure de leur découpage.
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
files = auth.py, llm_limiter.py, limits.py, summary.py, errors.py, validation.py, orphans.py, delivery.py, qa_report.py, metrics_roles.py, metrics_collect.py, metrics_report.py, main.py,
        schemas.py, memory_monitor.py, error_handlers.py,
        routes_metrics.py, routes_history.py, routes_conversations.py, routes_execute.py,
        execution.py, execution_state.py, execution_context.py, execution_resume.py,
        execution_outcomes.py, execution_persistence.py,
        crew_retry.py, crew_workflow.py, qualification.py, crew_llms.py, crew_summary.py, conversation_context.py, crew_workspace.py, crew_guardrails.py, crew_cache.py, crew_run.py, crew_result.py, crew_state.py, crew_tools.py, crew_checks.py, crewquestion.py,
        github_client.py, github_guards.py, github_edit_failures.py, github_read.py, github_write.py, github_edit.py,
        github_snapshot.py, github_delivery.py, github_pull_request.py, github_access.py, github_batch.py,
        tools.py, analyst_output.py, analyst_blocks.py, analyst_edits.py, analyst_imports.py, analyst_placeholders.py

# main.py, routes_*, execution* : les `Optional[int]` des clés primaires SQLModel (db_entry.id) et le typage des colonnes SQLAlchemy
# produisent un bruit important (arg-type, union-attr, operator, call-overload) sans rapport avec des bugs ;
# ces codes sont désactivés ICI SEULEMENT, les autres (attribut inexistant, variable non annotée, affectation
# incompatible, retour manquant) restent vérifiés. À réduire en typant les identifiants au fil du découpage.
[mypy-main,crew_run,crew_tools,crew_checks,schemas,memory_monitor,error_handlers,routes_metrics,routes_history,routes_conversations,routes_execute,execution,execution_state,execution_context,execution_resume,execution_outcomes,execution_persistence]
disable_error_code = arg-type, union-attr, operator, call-overload
